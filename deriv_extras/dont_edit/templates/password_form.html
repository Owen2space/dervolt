<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        #body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #4B5563;
        }
        .password-strength {
            margin-top: 0.25rem;
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans" id="body">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-6 text-center">Set Your Password</h2>
            
            {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                {{ error }}
            </div>
            {% endif %}
            
            <form action="/set_password" method="post" class="space-y-4" id="passwordForm">
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <span class="toggle-password" onclick="togglePasswordVisibility('password')">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </span>
                    </div>
                    <div class="password-strength bg-gray-200 mt-1"></div>
                    <p class="text-xs text-gray-500 mt-1 password-hint"></p>
                </div>
                
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <div class="password-container">
                        <input type="password" id="confirm_password" name="confirm_password" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <span class="toggle-password" onclick="togglePasswordVisibility('confirm_password')">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </span>
                    </div>
                </div>
                
                <div class="password-match-message text-sm"></div>
                
                <div>
                    <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Set Password
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId) {
            const passwordInput = document.getElementById(inputId);
            const icon = passwordInput.nextElementSibling.querySelector('svg');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                // Change to "hide" icon
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                passwordInput.type = 'password';
                // Change back to "show" icon
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        // Check password strength
        const passwordInput = document.getElementById('password');
        const strengthIndicator = document.querySelector('.password-strength');
        const passwordHint = document.querySelector('.password-hint');
        
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            if (password.length >= 8) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            
            switch(strength) {
                case 0:
                    strengthIndicator.style.width = '25%';
                    strengthIndicator.className = 'password-strength bg-red-500';
                    passwordHint.textContent = 'Very weak password';
                    break;
                case 1:
                    strengthIndicator.style.width = '50%';
                    strengthIndicator.className = 'password-strength bg-orange-500';
                    passwordHint.textContent = 'Weak password';
                    break;
                case 2:
                    strengthIndicator.style.width = '75%';
                    strengthIndicator.className = 'password-strength bg-yellow-500';
                    passwordHint.textContent = 'Medium strength password';
                    break;
                case 3:
                    strengthIndicator.style.width = '90%';
                    strengthIndicator.className = 'password-strength bg-blue-500';
                    passwordHint.textContent = 'Strong password';
                    break;
                case 4:
                    strengthIndicator.style.width = '100%';
                    strengthIndicator.className = 'password-strength bg-green-500';
                    passwordHint.textContent = 'Very strong password';
                    break;
            }
        });

        // Check if passwords match
        const confirmPasswordInput = document.getElementById('confirm_password');
        const passwordMatchMessage = document.querySelector('.password-match-message');
        const form = document.getElementById('passwordForm');

        function checkPasswordMatch() {
            if (confirmPasswordInput.value === '') {
                passwordMatchMessage.textContent = '';
                passwordMatchMessage.className = 'password-match-message text-sm';
                return;
            }
            
            if (passwordInput.value === confirmPasswordInput.value) {
                passwordMatchMessage.textContent = 'Passwords match';
                passwordMatchMessage.className = 'password-match-message text-sm text-green-600';
            } else {
                passwordMatchMessage.textContent = 'Passwords do not match';
                passwordMatchMessage.className = 'password-match-message text-sm text-red-600';
            }
        }

        passwordInput.addEventListener('input', checkPasswordMatch);
        confirmPasswordInput.addEventListener('input', checkPasswordMatch);

        form.addEventListener('submit', function(e) {
            if (passwordInput.value !== confirmPasswordInput.value) {
                e.preventDefault();
                passwordMatchMessage.textContent = 'Passwords do not match';
                passwordMatchMessage.className = 'password-match-message text-sm text-red-600';
            }
        });
    </script>
</body>
</html>
