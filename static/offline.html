<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - Der-volt</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
        }
        .offline-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .offline-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .retry-button {
            transition: all 0.2s ease;
        }
        .retry-button:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon bg-blue-100 text-blue-600 rounded-full flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-16 h-16">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-4.5-6.5"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.5 12.5l1.5 1.5 3-3"></path>
            </svg>
        </div>
        
        <h1 class="text-3xl font-bold text-gray-800 mb-2">You're offline</h1>
        <p class="text-gray-600 max-w-md mb-8">Please check your internet connection and try again. Some features may be available while offline.</p>
        
        <button onclick="tryToReconnect()" class="retry-button bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-sm flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5 mr-2">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            Try Again
        </button>
        
        <div class="mt-8 text-gray-500 text-sm">
            <p>If you continue to see this page, please contact support.</p>
        </div>
    </div>
    
    <script>
        // Function to try to reconnect
        function tryToReconnect() {
            // Check if we're back online
            if (navigator.onLine) {
                // Redirect to the dashboard or home page
                window.location.href = '/dashboard';
            } else {
                // Still offline, show a message
                alert('You are still offline. Please check your internet connection.');
            }
        }
        
        // Listen for online status changes
        window.addEventListener('online', () => {
            // When we come online, try to navigate back
            window.location.href = '/dashboard';
        });
    </script>
</body>
</html>
