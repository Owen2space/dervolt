<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Error - Der-volt</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-poppins bg-gray-100">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">
            <div>
                <a href="{{ url_for('index') }}">
                    <img class="mx-auto h-12 w-auto" src="{{ url_for('static', filename='images/der-volt-logo.png') }}" alt="Der-volt Logo">
                </a>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Oops! Something went wrong</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    We encountered an error processing your request.
                </p>
            </div>
            
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                <span class="block sm:inline">{{ error }}</span>
            </div>
            
            <div class="mt-6 text-center">
                <p>
                    <a href="{{ url_for('index') }}" class="font-medium text-teal-600 hover:text-teal-500">
                        Return to Homepage
                    </a>
                </p>
                <p class="mt-2">
                    <a href="{{ url_for('login') }}" class="font-medium text-teal-600 hover:text-teal-500">
                        Go to Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
