<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white shadow-lg rounded-lg p-8 text-center">
            <div class="mb-8">
                <i class="fas fa-tools text-7xl text-indigo-500"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Site Under Maintenance</h1>
            <p class="text-gray-600 mb-8">{{ message }}</p>
            <div class="mb-4">
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div class="bg-indigo-600 h-2.5 rounded-full animate-pulse" style="width: 45%"></div>
                </div>
            </div>
            <p class="text-sm text-gray-500">
                Please check back later or contact support if you need immediate assistance.
            </p>
        </div>
    </div>
</body>
</html>
